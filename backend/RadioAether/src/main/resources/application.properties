spring.application.name=aether-backend

# ── Datasource (PostgreSQL) ───────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aether_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aether}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aether_secret_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Hibernate ─────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:Kraj8AxPPe5XdByv9wN4o4cwhW8ExUoxH3kGIG9oY3MobGgN7zbPmmG2aomaZ7RP6EH17Le6RdX6+k0DPxqbfQ==}
app.jwt.expiration-minutes=60

# ── Server ────────────────────────────────────────────────────────────────────
server.address=0.0.0.0

# ── AI ────────────────────────────────────────────────────────────────────────
spring.ai.google.genai.api-key=${GEMINI_API_KEY:your_gemini_api_key_here}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# ── Weather ───────────────────────────────────────────────────────────────────
openweather.api-key=${OPENWEATHER_API_KEY:your_openweather_api_key_here}

